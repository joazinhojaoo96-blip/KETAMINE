name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS compile check
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode (iOS 26 SDK required)
        run: |
          set -euo pipefail
          # Theme.swift uses the Liquid Glass SwiftUI APIs (glassEffect,
          # GlassEffectContainer, .glassProminent) — they only exist in the
          # iOS 26+ SDK, and the image default is often an older Xcode.
          candidates=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V)
          echo "Installed:"; printf '%s\n' "$candidates"
          pick=$(printf '%s\n' "$candidates" | grep -E 'Xcode_26\.[0-9]+(\.[0-9]+)?\.app$' | tail -n 1 || true)
          if [ -z "$pick" ]; then pick=$(printf '%s\n' "$candidates" | tail -n 1); fi
          echo "Picking $pick"
          sudo xcode-select -s "$pick"
          xcodebuild -version
          xcodebuild -sdk iphoneos -version

      - name: Toolchain
        run: |
          swift --version
          xcodegen --version || brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, generic iOS)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Ketamine.xcodeproj \
            -scheme Ketamine \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Package IPA
        env:
          CERT_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERT_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROVISION_PROFILE }}
        run: |
          set -euo pipefail
          APP=$(find DerivedData/Build/Products -maxdepth 3 -name 'Ketamine.app' | head -n 1)
          test -n "$APP" || { echo "Ketamine.app not produced"; exit 1; }

          rm -rf package
          mkdir -p package/Payload
          ditto "$APP" package/Payload/Ketamine.app
          ditto -c -k --keepParent "$APP" Ketamine-unsigned.zip

          # Optional: sign when the repo has certificate + profile secrets,
          # otherwise ship the unsigned IPA for TrollStore / ESign / SideStore.
          if [ -n "$CERT_P12" ] && [ -n "$PROFILE" ]; then
            echo "Signing with provided certificate"
            KEYCHAIN_PASS=$(uuidgen)
            security create-keychain -p "$KEYCHAIN_PASS" build.keychain
            security set-keychain-settings -lut 21600 build.keychain
            security unlock-keychain -p "$KEYCHAIN_PASS" build.keychain
            security list-keychains -d user -s build.keychain login.keychain
            printf '%s' "$CERT_P12" | base64 --decode > cert.p12
            security import cert.p12 -k build.keychain -P "$CERT_PASS" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -k "$KEYCHAIN_PASS" build.keychain >/dev/null
            printf '%s' "$PROFILE" | base64 --decode > package/Payload/Ketamine.app/embedded.mobileprovision
            security cms -D -i package/Payload/Ketamine.app/embedded.mobileprovision > profile.plist
            /usr/libexec/PlistBuddy -x -c 'Print Entitlements' profile.plist > entitlements.plist
            IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep -m1 'Apple' | sed -E 's/.*"(.+)".*/\1/')
            echo "Identity: $IDENTITY"
            codesign --force --sign "$IDENTITY" --entitlements entitlements.plist \
              --timestamp=none package/Payload/Ketamine.app
            codesign --verify --verbose=2 package/Payload/Ketamine.app
          else
            echo "No signing secrets — packaging unsigned IPA"
          fi

          rm -f Ketamine.ipa
          (cd package && zip -qry ../Ketamine.ipa Payload)
          unzip -l Ketamine.ipa | head -n 5

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ketamine-${{ github.sha }}
          path: |
            Ketamine.ipa
            Ketamine-unsigned.zip
          retention-days: 7
          if-no-files-found: error
